openapi: 3.0.3
info:
  title: Alper Marble Contact API
  version: 1.0.0
  description: >
    Contract for the Contact page's inquiry endpoint. Accepted inquiries are
    delivered by email via Resend (mode "email"); a "simulate" mode exists for
    local/test environments and never calls the provider.

servers:
  - url: http://localhost:3000
    description: Next.js local development server

paths:
  /api/contact:
    post:
      summary: Submit a contact inquiry
      operationId: createContactInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInquiry"
      responses:
        "200":
          description: >
            Inquiry accepted for delivery. `data.mode` reflects whether the
            provider actually sent the email ("email") or the request was
            handled by non-production "simulate" configuration. A filled
            honeypot field also returns this response without attempting
            delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquirySuccess"
        "400":
          description: Malformed JSON request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Missing or invalid inquiry fields, or oversized request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >
            Email delivery is unavailable (`CONTACT_DELIVERY_UNAVAILABLE`) due
            to missing/invalid server configuration or a provider failure.
            Visitors should retry or use a direct contact channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ContactInquiry:
      type: object
      required: [name, phone, preferredTime, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          pattern: "^[0-9+()\\-\\s]{7,20}$"
        preferredTime:
          type: string
          enum:
            - בוקר (08:00 - 12:00)
            - צהריים (12:00 - 15:00)
            - אחר הצהריים (15:00 - 17:30)
        message:
          type: string
          minLength: 1
          maxLength: 2000
        website:
          type: string
          maxLength: 0
          description: >
            Anti-spam honeypot. Must remain empty; real visitors never see or
            fill this field. A non-empty value is accepted with a normal
            success response but never delivered.
    ContactInquirySuccess:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [delivered, mode]
          properties:
            delivered:
              type: boolean
              const: true
            mode:
              type: string
              enum: [email, simulate]
              description: >
                "email" when Resend accepted the message; "simulate" only
                occurs in non-production configuration.
        requestId:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
          format: uuid
